inherit_gem:
  wallaby-cop: rubocop.yml

AllCops:
  Exclude:
    - 'bin/rails'
    - 'gemfiles/**/*'
    - 'spec/rails_helper.rb'
    - 'spec/spec_helper.rb'
    - 'spec/dummy/**/*'
    - 'spec/dummy/*'
    - 'spec/views/wallaby/resources/*/_xml.html.erb_spec.rb'
    - '*/vendor/**/*'

CodeReuse/ActiveRecord:
  Exclude:
    - 'spec/**/*'

GitlabSecurity/PublicSend:
  Exclude:
    - 'spec/**/*'

Layout/LineLength:
  Exclude:
    - 'spec/**/*'

Naming/FileName:
  Exclude:
    - wallaby-cop/lib/wallaby-cop.rb

Rails/OutputSafety:
  Enabled: false

Rails/FilePath:
  Exclude:
    - 'spec/**/*'

RSpec/MultipleMemoizedHelpers:
  Exclude:
    - 'spec/**/*'

RSpec/SpecFilePathFormat:
  # Specs are grouped by gem directory (`spec/wallaby-active_record/`,
  # `spec/wallaby-core/`), which does not mirror the namespace this cop expects.
  Exclude:
    - 'spec/wallaby-active_record/**/*'
    - 'spec/wallaby-core/**/*'
    # Security regression specs are grouped by concern, not by namespace, so the
    # path/description mapping the cop wants does not apply.
    - 'spec/security/**/*'
