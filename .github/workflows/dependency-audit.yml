# Weekly vulnerability audit of the Ruby dependencies.
#
# Complements Dependabot (which cannot watch bundler here because Gemfile.lock
# is not committed) and the per-PR `bundler-audit` step in `pr-build.yml`: this
# job runs on a schedule so newly published advisories are caught even when no
# pull request is open.
name: dependency-audit

on:
  schedule:
    # Every Monday at 00:00 UTC.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundler-audit:
    runs-on: ubuntu-latest
    env:
      # Use a matrix Gemfile: unlike the root Gemfile it does not pin an exact
      # Ruby patch version, so it resolves on the runner's Ruby.
      BUNDLE_GEMFILE: ${{ github.workspace }}/.gemfiles/Gemfile.rails-8.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          rubygems: latest

      - name: Audit dependencies
        run: |
          # Gemfile.lock is gitignored, so resolve one for the matrix Gemfile.
          bundle lock
          # bundler-audit reads a `Gemfile.lock` from a directory; audit a copy
          # of the resolved lockfile.
          audit_dir="$(mktemp -d)"
          cp "${BUNDLE_GEMFILE}.lock" "${audit_dir}/Gemfile.lock"
          gem install bundler-audit --no-document
          bundle-audit update
          bundle-audit check "${audit_dir}"
