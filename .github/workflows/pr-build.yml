name: pr-build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

# SECURITY: default to the least privilege. The job only needs to read the repo.
permissions:
  contents: read

jobs:
  pr-build:
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.gemfiles/Gemfile.rails-${{ matrix.rails }}
      RAILS_ENV: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    services:
      postgres:
        # Pin the major version so CI does not silently pick up a new, untested
        # image (supply-chain / reproducibility).
        image: postgres:18-alpine
        env:
          POSTGRES_DB: wallaby_rails_dummy_test
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:9
        env:
          MYSQL_DATABASE: wallaby_rails_dummy_test
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        os: [ubuntu-latest]
        # NOTE: check the versions that Ruby supports at https://www.ruby-lang.org/en/downloads/branches/
        ruby: ['4.0', '3.4', '3.3']
        # NOTE: check the versions that Rails supports at https://guides.rubyonrails.org/maintenance_policy.html
        rails: ['8.1', '8.0']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # @see https://github.com/openstreetmap/openstreetmap-website/issues/4364
          rubygems: latest

      - name: Rubocop Check
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --name-only ${{ github.event.pull_request.base.sha }} --diff-filter AMT | xargs bundle exec rubocop --force-exclusion

      # SECURITY: fail the build on known-vulnerable dependencies. Runs on a
      # single matrix entry to keep the job count reasonable.
      - name: Dependency vulnerability audit
        if: ${{ matrix.ruby == '4.0' && matrix.rails == '8.1' }}
        run: |
          # Gemfile.lock is gitignored, so resolve one for the matrix Gemfile.
          bundle lock
          # bundler-audit reads a `Gemfile.lock` from a directory; audit a copy
          # of the resolved lockfile.
          audit_dir="$(mktemp -d)"
          cp "${BUNDLE_GEMFILE}.lock" "${audit_dir}/Gemfile.lock"
          gem install bundler-audit --no-document
          bundle-audit update
          bundle-audit check "${audit_dir}"

