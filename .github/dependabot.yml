# Dependabot configuration.
#
# NOTE: the Ruby `bundler` ecosystem is intentionally omitted: `Gemfile.lock`
# is not committed (see AGENTS.md), and Dependabot's bundler support requires a
# committed lockfile. Ruby dependencies are instead audited by the scheduled
# `.github/workflows/dependency-audit.yml` workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: '/wallaby'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Ruby dependency updates are not enabled because `Gemfile.lock` is not
  # committed (see the note above and AGENTS.md). To turn them on:
  #   1. stop ignoring `Gemfile.lock` in `.gitignore` and commit it;
  #   2. uncomment the entry below.
  # A single root entry is enough: the root `Gemfile` `path:`-includes all five
  # gems, so per-gem directories would be redundant.
  #
  # - package-ecosystem: bundler
  #   directory: '/'
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 5
